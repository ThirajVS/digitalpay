<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" role="img" aria-labelledby="title desc">
  <title id="title">Digital wallet dashboard illustration</title>
  <desc id="desc">Abstract cards showing a secure wallet, transaction activity and a payment confirmation.</desc>
  <defs>
    <linearGradient id="bg" x1="80" y1="40" x2="670" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#e7efff"/><stop offset="1" stop-color="#dff8f4"/>
    </linearGradient>
    <linearGradient id="card" x1="190" y1="155" x2="540" y2="406" gradientUnits="userSpaceOnUse">
      <stop stop-color="#173f9b"/><stop offset="1" stop-color="#0b1739"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#0b1739" flood-opacity=".18"/></filter>
  </defs>
  <rect x="30" y="28" width="700" height="500" rx="48" fill="url(#bg)"/>
  <circle cx="118" cy="118" r="42" fill="#fff" opacity=".66"/><circle cx="650" cy="430" r="58" fill="#fff" opacity=".5"/>
  <g filter="url(#shadow)">
    <rect x="135" y="140" width="435" height="275" rx="30" fill="url(#card)"/>
    <circle cx="515" cy="200" r="26" fill="#2f6bff"/><circle cx="537" cy="200" r="26" fill="#18b6a4" fill-opacity=".78"/>
    <text x="180" y="204" fill="#9eb5e9" font-family="Arial,sans-serif" font-size="17">AVAILABLE BALANCE</text>
    <text x="180" y="254" fill="white" font-family="Arial,sans-serif" font-size="39" font-weight="700">₹48,520.75</text>
    <rect x="180" y="314" width="114" height="43" rx="13" fill="#2f6bff"/><text x="205" y="342" fill="white" font-family="Arial,sans-serif" font-size="15" font-weight="700">Send money</text>
    <path d="M342 348c25-31 45-6 67-38 21-30 44-6 82-49" fill="none" stroke="#8bf0df" stroke-width="6" stroke-linecap="round"/>
    <circle cx="492" cy="260" r="7" fill="#8bf0df"/>
  </g>
  <g filter="url(#shadow)">
    <rect x="484" y="348" width="191" height="112" rx="23" fill="white"/>
    <circle cx="523" cy="387" r="20" fill="#e0f8f3"/><path d="m514 387 6 6 12-14" fill="none" stroke="#129786" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="552" y="383" fill="#0b1739" font-family="Arial,sans-serif" font-size="15" font-weight="700">Payment sent</text>
    <text x="552" y="406" fill="#61708f" font-family="Arial,sans-serif" font-size="13">₹2,500 · Successful</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="86" y="350" width="170" height="105" rx="23" fill="white"/>
    <text x="111" y="385" fill="#61708f" font-family="Arial,sans-serif" font-size="13">THIS MONTH</text>
    <text x="111" y="420" fill="#0b1739" font-family="Arial,sans-serif" font-size="25" font-weight="700">+12.8%</text>
  </g>
</svg>
